<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo sign in — Medicinal Lifestyle</title><link rel="stylesheet" href="account.css"><script src="demo-seed.js"></script><script src="demo.js"></script></head><body><header><a class="brand" href="index.html">MEDICINAL<small>LIFESTYLE</small></a></header><main><p class="eyebrow">PROTOTYPE ACCOUNT</p><h1>SIGN IN TO THE DEMO.</h1><p>No password or real personal information is needed. This sample account and its orders exist only in your browser.</p><button id="signIn" class="primary" style="padding:18px;background:#d7ff35;border:0;cursor:pointer">CONTINUE AS DEMO CUSTOMER →</button></main><script>const params=new URLSearchParams(location.search);if(params.has('logout'))demoSignOut();document.querySelector('#signIn').onclick=()=>{demoSignIn();let next=params.get('return_to')||'account.html';if(next.startsWith('/'))next='index.html'+next.slice(1);const url=new URL(next,location.href),base=new URL('.',location.href);location.href=url.origin===base.origin&&url.pathname.startsWith(base.pathname)?url.href:'account.html';};</script></body></html>
